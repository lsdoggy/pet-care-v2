spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/petcare}
spring.datasource.username=${DB_USER:petcare}
spring.datasource.password=${DB_PASSWORD:petcare_dev_password}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Shared migrations plus the SQL variant for the active database.
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}

app.jwt.secret=${JWT_SECRET:cGV0Y2FyZS1kZXYtand0LXNlY3JldC1jaGFuZ2UtbWUtMjAyNg==}
app.jwt.expiration=15m

# Uploaded files (pet photos, record attachments) are stored under ./uploads and served at /files/**
app.upload.dir=${UPLOAD_DIR:uploads}
# Pet photos keep a 5 MB cap; record attachments (PDF scans) may be up to 10 MB (enforced in FileStorageService).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---------------------------------------------------------------------------
# Sprint 6: notification system
# ---------------------------------------------------------------------------
# Reminder scheduler: scan every minute, notify tasks due within the next 60 minutes.
app.notifications.reminder-window-minutes=${REMINDER_WINDOW_MINUTES:60}
app.notifications.scan-interval-ms=60000
app.notifications.retry-interval-ms=60000

# Expo Push Service (primary transport -> forwards to FCM/APNs; no google-services.json needed).
# Access token is OPTIONAL (rate limits only); never commit it — pass via env.
app.notifications.expo.enabled=${EXPO_PUSH_ENABLED:true}
app.notifications.expo.access-token=${EXPO_PUSH_ACCESS_TOKEN:}

# Raw FCM fallback for native builds (firebase-admin HTTP v1). Disabled by default.
# When enabled, provide GOOGLE_APPLICATION_CREDENTIALS=path/to/service-account.json
app.notifications.fcm.enabled=${FCM_ENABLED:false}

# SMTP (Gmail example — use an App Password, not the account password).
# JavaMailSender autoconfig activates only when MAIL_HOST is set; otherwise email rows
# are logged and marked failed for retry (see SmtpMailSender).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@petcare.local}}

app.account.recovery-page=${APP_ACCOUNT_RECOVERY_PAGE:}
