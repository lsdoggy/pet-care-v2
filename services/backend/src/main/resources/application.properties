spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/petcare}
spring.datasource.username=${DB_USER:petcare}
spring.datasource.password=${DB_PASSWORD:petcare_dev_password}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:cGV0Y2FyZS1kZXYtand0LXNlY3JldC1jaGFuZ2UtbWUtMjAyNg==}
app.jwt.expiration=15m

# Uploaded files (pet photos) are stored under ./uploads and served at /files/uploads/**
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
