spring.datasource.url=jdbc:h2:mem:petcare_test_${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.jwt.secret=cGV0Y2FyZS10ZXN0LWp3dC1zZWNyZXQtbXVzdC1iZS1sb25nLTI1Ni1iaXQ=
app.jwt.expiration=15m

# Tests write uploads to a temp dir outside the repo source tree
app.upload.dir=${java.io.tmpdir}/petcare-test-uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Sprint 6: no outbound push/email traffic in tests; scheduler runs on demand via TestEntityManager only.
app.notifications.expo.enabled=false
app.notifications.fcm.enabled=false
app.notifications.initial-delay-ms=3600000
app.notifications.scan-interval-ms=3600000
app.notifications.retry-interval-ms=3600000
