name: Gemini Assistant

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gemini-cli:
    runs-on: ubuntu-latest
    # Запускается при открытии PR или при упоминании @gemini в комментариях к Issue/PR
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prompt: |
            Изучи контекст задачи или изменения в Pull Request.
            Если это PR — проведи код-ревью, найди возможные баги, проблемы с безопасностью или архитектурой.
            Если тебя упомянули в комментарии — ответь на вопрос или помоги с задачей по кодовой базе.
            Отвечай на русском языке.
